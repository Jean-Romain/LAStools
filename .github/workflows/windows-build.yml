name: Windows C++ Build DLL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Install MSYS2 (includes MinGW)
      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-i686-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-i686-cmake
            make

      # 3️⃣ Create build directory and configure CMake
      - name: Configure CMake
        shell: bash
        run: |
          mkdir -p build
          cd build
          cmake -G "MinGW Makefiles" -DBUILD_SHARED_LIBS=ON ..

      # 4️⃣ Build LASlib
      - name: Build LASlib
        shell: bash
        run: |
          cd build
          mingw32-make -j$(nproc)

      # 5️⃣ Upload artifacts (DLL + import library)
      - name: Upload LASlib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LASlib-Windows
          path: |
            build/*.dll
            build/*.a
