name: Windows C++ Build DLL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    - name: Configure CMake
      run: cmake -B build -S . -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release

    - name: Build DLL
      run: cmake --build build --config Release

    - name: Upload entire repo
      uses: actions/upload-artifact@v4
      with:
        name: LAStools
        path: ./

